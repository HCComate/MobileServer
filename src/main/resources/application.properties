# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# MySQL Database
# 환경변수로 주입: DB_URL, DB_USERNAME, DB_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# AdminPC-Server 연결 정보
# 환경변수로 주입: ADMIN_PC_BASE_URL, ADMIN_PC_USERNAME, ADMIN_PC_PASSWORD
# 예) ADMIN_PC_BASE_URL=http://192.168.0.10:5000
# ============================================================
admin.pc.base-url=${ADMIN_PC_BASE_URL}
admin.pc.username=${ADMIN_PC_USERNAME}
admin.pc.password=${ADMIN_PC_PASSWORD}

