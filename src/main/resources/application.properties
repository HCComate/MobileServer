# 서버 포트를 8080으로 설정
server.port=8080

# 데이터베이스 설정 (MySQL 설치 없이 바로 실행되는 H2 사용)
spring.datasource.url=jdbc:h2:mem:semsedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# AdminPC-Server 연동 (내 컴퓨터에서 8080번 포트를 바라보게 설정)
admin.pc.base-url=http://localhost:5000
admin.pc.username=admin
admin.pc.password=admin1234

# H2 콘솔 및 기타 설정
spring.main.allow-circular-references=true
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
