server.port=8080

# 2. 데이터베이스 설정 (MySQL 오류 방지를 위해 H2로 고정)
spring.datasource.url=jdbc:h2:mem:semsedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. AdminPC-Server 연동 (한 컴에서 다 띄우신다면 localhost가 정답!)
admin.pc.base-url=http://localhost:5000
admin.pc.username=admin
admin.pc.password=admin1234

# 5. 기타 필수 설정
spring.main.allow-circular-references=true
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false