# 서버 포트 설정 (기본값: 8080)
server.port=8080

# 콘솔 출력 인코딩 (Windows 한글 깨짐 방지)
spring.output.ansi.enabled=detect
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# 데이터베이스 설정 - H2 (MySQL 설치 없이 바로 실행 가능)
spring.datasource.url=jdbc:h2:mem:semsedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP 커넥션 풀 설정
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=10000

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 콘솔 및 기타 설정
spring.main.allow-circular-references=true
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false

# AdminPC-Server 연동 설정 (실제 IP로 변경 필요)
# 예: admin.pc.base-url=http://192.168.0.100:5000
admin.pc.base-url=http://localhost:5000
admin.pc.username=admin
admin.pc.password=admin1234
